<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e6ddcc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="DeuLern Deutsch Wortschatz — learn German vocabulary for CEFR levels A1, A2 and B1. Runs entirely in your browser."
    />
    <title>DeuLern Deutsch Wortschatz</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeuLern" />
    <meta property="og:title" content="DeuLern Deutsch Wortschatz" />
    <meta
      property="og:description"
      content="Learn German vocabulary for CEFR levels A1, A2 and B1. Runs entirely in your browser."
    />
    <meta property="og:url" content="https://wortschatz.deulern.com/" />
    <meta property="og:image" content="https://wortschatz.deulern.com/apple-touch-icon.png" />
    <script>
      // Applies the saved theme before the first paint, so an explicit choice never
      // flashes the other theme. The key must stay in step with THEME_STORAGE_KEY in
      // src/components/layout/ThemeToggle.tsx.
      try {
        var theme = localStorage.getItem('deulernTheme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Unreadable storage: fall back to the system theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
